services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yoklama
      POSTGRES_USER: yoklama
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoklama -d yoklama"]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://yoklama:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/yoklama
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CREDENTIALS_FILE: /data/ilk-hesaplar.txt
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./client
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
